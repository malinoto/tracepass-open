# Publishes the five @tracepass/* packages in this workspace to npm on every
# v*.*.* tag push, each with an npm provenance attestation. Provenance lets
# anyone cryptographically verify a package was built by this exact workflow,
# from this exact repository and commit —
# see https://docs.npmjs.com/generating-provenance-statements.
#
# Packages: @tracepass/dpp-types, @tracepass/gs1-utils, @tracepass/dpp-epcis,
# @tracepass/dpp-validate, @tracepass/dpp-identifiers.
# They share a version; bump them all together.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# OIDC Trusted Publishing (no long-lived secrets) must be registered for EACH
# package. The four original packages already exist from their bootstrap publish.
# @tracepass/dpp-identifiers is NEW and requires two one-time steps before this
# workflow can publish it:
#
#   Step A — Bootstrap publish (once, from a local checkout with a token):
#     npm publish --workspace @tracepass/dpp-identifiers --access public
#   The package must exist on the registry before OIDC can claim it.
#
#   Step B — Register the Trusted Publisher:
#   At https://www.npmjs.com/package/@tracepass/dpp-identifiers/access :
#   1. Trusted Publishers → Add a publisher → GitHub Actions.
#   2. Organization or user: malinoto
#      Repository:           tracepass-open
#      Workflow filename:    publish.yml   (filename only)
#      Environment name:     (leave blank)
#   3. Allowed actions: tick npm publish.
#   4. Save. The repo must be PUBLIC for provenance to be accepted.
#
# The same registration is already done for the four existing packages:
#
#   For each of the 4 original packages, at
#   https://www.npmjs.com/package/<pkg>/access :
#   1. Trusted Publishers → Add a publisher → GitHub Actions.
#   2. Organization or user: malinoto
#      Repository:           tracepass-open
#      Workflow filename:    publish.yml   (filename only)
#      Environment name:     (leave blank)
#   3. Allowed actions: tick npm publish.
#   4. Save. The repo must be PUBLIC for provenance to be accepted.
#
# ─── RELEASE FLOW ──────────────────────────────────────────────────────────────
#
#   # bump all five workspace packages to the same version, then tag:
#   npm version patch --workspaces --include-workspace-root=false
#   npm version patch --no-git-tag-version   # bump the root marker (optional)
#
#   # ⚠️ THEN FIX THE CROSS-PACKAGE DEPS BY HAND — npm version does NOT.
#   # dpp-validate depends on dpp-types; dpp-epcis depends on both. Those
#   # ranges stay at the OLD version, and a caret range below 1.0.0 is
#   # restrictive — "^0.1.4" does not match 0.2.0. Ship it and a fresh
#   # `npm i @tracepass/dpp-validate` resolves the PREVIOUS dpp-types from the
#   # registry, so whatever you just added appears missing. Local dev never
#   # catches it: the workspace symlinks the sibling regardless of the range.
#   sed -i 's/"\(@tracepass\/[a-z0-9-]*\)": "^OLD"/"\1": "^NEW"/' packages/*/package.json
#   npm install --package-lock-only
#   grep '"@tracepass/' packages/*/package.json   # verify before committing
#
#   git commit -am "release: v0.1.1" && git tag v0.1.1
#   git push && git push origin v0.1.1
#
# The workflow runs typecheck → test → build → publish (all workspaces).
# Green CI does NOT prove the deps are right — it builds from the workspace,
# not the registry. Verify after publishing:
#   npm view @tracepass/dpp-validate@X.Y.Z dependencies

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'
          # Without registry-url, `npm publish` 404s before it can attempt the
          # OIDC exchange.
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        # Trusted publishing via OIDC needs npm CLI >= 11.5.1.
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Build FIRST: every downstream step resolves the @tracepass/* siblings
        # through their dist/ output. Typecheck (tsc across the workspace) and
        # the cross-package tests (e.g. dpp-epcis imports @tracepass/gs1-utils)
        # both fail with "Cannot find module @tracepass/..." if dist/ is absent.
        # The root build script builds in dependency order (types + gs1-utils
        # before epcis + validate) — plain --workspaces builds alphabetically,
        # which puts dpp-epcis first and fails.
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Publish every workspace package whose version is not yet on npm
        # No NODE_AUTH_TOKEN: an empty token would make npm reject with
        # ENEEDAUTH before attempting OIDC. Absent ⇒ OIDC engages cleanly.
        # Provenance comes from publishConfig.provenance: true in each
        # package.json. `npm publish --workspaces` aborted the whole run on the
        # first version already on the registry, so a re-run after a partial
        # failure, or a new package bootstrapped by hand (a trusted publisher
        # can only be registered once the package exists), could never finish.
        # Each package is published on its own and skipped when its version
        # already exists. All packages still share one version per release.
        # One failing package no longer stops the others: every package is
        # attempted and the step fails at the end, naming what did not publish.
        # Registry reads lag a publish by minutes, so a version published moments
        # earlier (e.g. a hand bootstrap) can look absent; re-run the job later
        # and it will be skipped.
        run: |
          failed=""
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "skip ${name}@${version}: already on npm"
            elif ! npm publish --workspace "${dir%/}"; then
              failed="${failed} ${name}@${version}"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "::error::not published:${failed}"
            exit 1
          fi

  github-release:
    # npm does not need a GitHub Release, but the repo page, its "Latest" badge
    # and catalogues that read GitHub do. Created only after npm accepted the
    # version, so the two never disagree. A separate job keeps the publish job's
    # token read-only.
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release for this tag (skip if it exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
